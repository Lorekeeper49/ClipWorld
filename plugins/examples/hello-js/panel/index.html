<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 10px; font: 13px system-ui, sans-serif; color: #e6e8ee; background: #16181d; }
  button { font: inherit; color: inherit; background: #282d38; border: 1px solid #3a4150; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  li { padding: 6px 8px; border-radius: 6px; background: #20242d; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  li:hover { background: #282d38; }
  .dim { color: #8a93a6; }
</style>
</head>
<body>
  <button id="refresh">Refresh</button>
  <ul id="list"><li class="dim">Click Refresh to list the clips.</li></ul>
<script>
  // A plugin window talks to its plugin with postMessage: { type: 'clipworld', data }.
  const send = (data) => parent.postMessage({ type: 'clipworld', data }, '*')
  const list = document.getElementById('list')
  document.getElementById('refresh').onclick = () => send({ action: 'refresh' })
  window.addEventListener('message', (e) => {
    if (e.data?.type !== 'clipworld' || !e.data.data?.clips) return
    const clips = e.data.data.clips
    if (!clips.length) {
      list.innerHTML = '<li class="dim">The timeline is empty.</li>'
      return
    }
    list.replaceChildren(...clips.map((c) => {
      const li = document.createElement('li')
      li.dataset.clipId = c.id
      const name = document.createElement('span')
      name.textContent = c.name
      const info = document.createElement('span')
      info.className = 'dim'
      info.textContent = `${c.start.toFixed(2)} s · ${c.type}`
      li.append(name, info)
      li.onclick = () => send({ action: 'select', id: c.id, start: c.start })
      return li
    }))
  })
  send({ action: 'refresh' })
</script>
</body>
</html>
